[package]
name = "rustresort-storage"
version = "0.1.0"
edition = "2024"
authors = ["RustResort Contributors"]
description = "Storage backends for RustResort"
license = "AGPL-3.0"

[dependencies]
aes-gcm = "0.10"
aws-sdk-s3 = { version = "1.0", default-features = false, features = ["rt-tokio"] }
aws-smithy-runtime = { version = "1", default-features = false, features = ["connector-hyper-0-14-x"] }
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
hyper-rustls = { version = "0.24.2", default-features = false, features = ["webpki-tokio", "http1", "http2", "tls12"] }
rand = "0.8"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono"] }
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

