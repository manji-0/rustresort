[package]
name = "rustresort-models"
version = "0.1.0"
edition = "2024"
authors = ["RustResort Contributors"]
description = "Shared data models for RustResort"
license = "AGPL-3.0"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.7", default-features = false, features = ["chrono", "macros", "sqlite"] }
ulid = "1"
