[package]
name = "rustresort"
version = "0.1.0"
edition = "2024"
authors = ["RustResort Contributors"]
description = "A lightweight, single-user ActivityPub server"
license = "AGPL-3.0"
repository = "https://github.com/manji-0/rustresort"

[workspace]
members = [
    ".",
    "crates/rustresort-models",
    "crates/rustresort-storage",
    "crates/rustresort-ui",
]
default-members = [".", "crates/rustresort-models", "crates/rustresort-storage"]

[features]
default = []
turso-sync = ["dep:turso"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# Web framework
axum = { version = "0.7", features = ["macros", "multipart"] }
axum-extra = { version = "0.9", features = ["typed-header", "cookie"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "limit"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"

# Database (SQLite only)
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "migrate", "macros"] }
# NOTE: `turso` sync support currently requires a pre-release line.
# Revisit and migrate to the next stable release when compatibility is confirmed.
# This dependency is optional and only enabled by the `turso-sync` feature.
turso = { version = "0.5.0-pre.12", default-features = false, features = ["sync"], optional = true }
# Note: rusqlite removed to avoid libsqlite3-sys version conflict with sqlx
# Backup functionality will be implemented using sqlx or alternative approach

# OpenSSL is used for VAPID key generation and R2/Turso compatibility.
# We use `vendored` for reproducible builds without relying on system OpenSSL.
openssl = { version = "0.10", features = ["vendored"] }

# Crypto/Signatures
rsa = "0.9"
sha2 = "0.10"
base64 = "0.21"
hmac = "0.12"
subtle = "2"
aes-gcm = "0.10"
rand = "0.8"
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
webauthn-rs = "0.5.4"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
http = "1.0"

# Utilities
ulid = "1"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
config = "0.14"
url = { version = "2", features = ["serde"] }
urlencoding = "2"
time = "0.3"
html-escape = "0.2"
ammonia = "4"
image = { version = "0.25", default-features = false, features = ["webp"] }
web-push = "0.10"
rustresort-models = { path = "crates/rustresort-models" }
rustresort-storage = { path = "crates/rustresort-storage" }

# Metrics
prometheus = "0.13"

# ActivityPub / JSON-LD
# TODO: Add appropriate crates

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
serde_json = "1"
serde_yaml = "0.9"
jsonschema = { version = "0.18", default-features = false }

[profile.release]
lto = true
codegen-units = 1
